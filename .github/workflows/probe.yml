# Scratch tool, never merged: fetches the URLs in .probe/urls.txt from GitHub's network (the
# development workspace can't reach university sites) and commits the raw responses back to
# this branch for review.
name: Probe

on:
  push:
    branches: ["probe/**"]
    paths: [".probe/urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch each URL politely (1 per second)
        run: |
          rm -rf .probe/out && mkdir -p .probe/out
          UA="BeyondTheSyllabusBot/0.1 (+https://github.com/Shabanaomar/BeyondtheSyllabus)"
          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1)); n=$(printf '%03d' $i)
            echo "$url" > .probe/out/$n.url
            curl -sS -L --max-time 40 --max-filesize 20000000 -A "$UA" \
              -D .probe/out/$n.headers -o .probe/out/$n.body \
              -w '%{http_code} %{url_effective} %{content_type}\n' "$url" > .probe/out/$n.status \
              2> .probe/out/$n.err || true
            sleep 1
          done < .probe/urls.txt
      - name: Commit results
        shell: bash
        run: |
          set +e
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add .probe/out; echo "add=$?" > /tmp/log.txt
          git commit -m "Probe results [skip ci]" >> /tmp/log.txt 2>&1; echo "commit=$?" >> /tmp/log.txt
          git push origin HEAD:${GITHUB_REF_NAME} >> /tmp/log.txt 2>&1; rc=$?; echo "push=$rc" >> /tmp/log.txt
          msg=$(tail -c 3000 /tmp/log.txt | sed ':a;N;$!ba;s/\n/ | /g')
          echo "::warning title=commit-log::$msg"
          exit $rc
