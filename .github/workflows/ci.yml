name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (engine coverage must stay at or above 90%)
        run: uv run pytest --cov=bts_engine --cov-report=term-missing --cov-fail-under=90
      - name: Dependency audit
        run: uv export --frozen --no-emit-project --format requirements.txt > /tmp/requirements.txt && uv run pip-audit --strict -r /tmp/requirements.txt

  web:
    name: Web (lint, format, types, Playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint, format and type check
        run: npm run check
      - name: Dependency audit (production dependencies block the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev tooling, report only)
        run: npm audit --audit-level=high || echo "::warning::Dev-only dependencies have known vulnerabilities; see log."
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (mobile + desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
