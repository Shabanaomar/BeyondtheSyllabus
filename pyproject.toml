[project]
name = "beyond-the-syllabus"
version = "0.1.0"
description = "Data collectors, planning engine, agent and evals for Beyond the Syllabus"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "psycopg[binary]>=3.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/bts_engine", "ingest/src/bts_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine/src", "ingest/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = ["engine/src", "ingest/src"]
packages = ["bts_engine", "bts_ingest"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "ingest/tests", "db/tests"]
addopts = "--strict-markers"
